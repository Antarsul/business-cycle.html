<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Business Cycle Asset Allocation</title>
  <style>
    :root {
      --color-background-primary: #ffffff;
      --color-background-secondary: #f4f3ef;
      --color-text-primary: #1a1a18;
      --color-text-secondary: #5f5e5a;
      --color-border-secondary: rgba(0,0,0,0.25);
      --color-border-tertiary: rgba(0,0,0,0.12);
      --border-radius-md: 8px;
      --border-radius-lg: 12px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --color-background-primary: #1e1e1c;
        --color-background-secondary: #2a2a28;
        --color-text-primary: #f0ede8;
        --color-text-secondary: #a8a59e;
        --color-border-secondary: rgba(255,255,255,0.25);
        --color-border-tertiary: rgba(255,255,255,0.12);
      }
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--color-background-primary);
      color: var(--color-text-primary);
      padding: 2rem 1.5rem;
      max-width: 720px;
      margin: 0 auto;
    }
    h1 {
      font-size: 18px;
      font-weight: 500;
      margin-bottom: 0.25rem;
      color: var(--color-text-primary);
    }
    .subtitle {
      font-size: 13px;
      color: var(--color-text-secondary);
      margin-bottom: 1.75rem;
    }
    .phase-row { display: flex; gap: 8px; margin-bottom: 1.5rem; flex-wrap: wrap; }
    .phase-btn {
      flex: 1; min-width: 130px; padding: 10px 8px;
      border-radius: var(--border-radius-md);
      border: 0.5px solid var(--color-border-secondary);
      background: var(--color-background-secondary);
      cursor: pointer; font-size: 13px; font-weight: 400;
      color: var(--color-text-secondary); text-align: center;
      transition: all 0.15s;
    }
    .phase-btn.active { border-width: 1.5px; font-weight: 500; }
    .phase-btn.p0.active { background: #E1F5EE; border-color: #1D9E75; color: #085041; }
    .phase-btn.p1.active { background: #E6F1FB; border-color: #378ADD; color: #0C447C; }
    .phase-btn.p2.active { background: #FAEEDA; border-color: #EF9F27; color: #633806; }
    .phase-btn.p3.active { background: #FCEBEB; border-color: #E24B4A; color: #791F1F; }
    .phase-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
    .p0-dot { background: #1D9E75; } .p1-dot { background: #378ADD; }
    .p2-dot { background: #EF9F27; } .p3-dot { background: #E24B4A; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 1.5rem; }
    .macro-card { background: var(--color-background-secondary); border-radius: var(--border-radius-md); padding: 12px 14px; }
    .macro-label { font-size: 11px; color: var(--color-text-secondary); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.04em; }
    .macro-val { font-size: 16px; font-weight: 500; }
    .up { color: #1D9E75; } .down { color: #E24B4A; } .flat { color: #888780; }
    .section-label { font-size: 11px; font-weight: 500; color: var(--color-text-secondary); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 10px; }
    .legend-row { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 1.25rem; }
    .legend-item { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--color-text-secondary); }
    .legend-sq { width: 10px; height: 10px; border-radius: 2px; }
    .bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
    .bar-name { font-size: 13px; color: var(--color-text-secondary); width: 150px; flex-shrink: 0; }
    .bar-track { flex: 1; height: 20px; background: var(--color-background-secondary); border-radius: 3px; overflow: hidden; }
    .bar-fill { height: 100%; border-radius: 3px; transition: width 0.4s ease; }
    .bar-pct { font-size: 12px; font-weight: 500; width: 36px; text-align: right; color: var(--color-text-primary); }
    .thesis { font-size: 13px; color: var(--color-text-secondary); line-height: 1.6; border-left: 2px solid var(--color-border-secondary); padding-left: 12px; margin-top: 1.5rem; }
  </style>
</head>
<body>

  <h1>Business cycle asset allocation</h1>
  <p class="subtitle">Illustrative allocations across the four phases of the business cycle</p>

  <div class="phase-row">
    <button class="phase-btn p0 active" onclick="setPhase(0)"><span class="phase-dot p0-dot"></span>Early recovery</button>
    <button class="phase-btn p1" onclick="setPhase(1)"><span class="phase-dot p1-dot"></span>Late expansion</button>
    <button class="phase-btn p2" onclick="setPhase(2)"><span class="phase-dot p2-dot"></span>Peak / slowdown</button>
    <button class="phase-btn p3" onclick="setPhase(3)"><span class="phase-dot p3-dot"></span>Recession</button>
  </div>

  <div class="grid" id="macroGrid"></div>
  <div class="section-label">Suggested allocation</div>
  <div class="legend-row" id="legendRow"></div>
  <div id="barChart"></div>
  <div class="thesis" id="thesis"></div>

  <script>
    const COLORS = ['#1D9E75','#378ADD','#EF9F27','#D4537E','#7F77DD','#888780','#D85A30'];
    const ASSETS = ['Equities (domestic)','Intl equities','Fixed income','Real estate','Commodities','Cash','Alternatives'];
    const phases = [
      {
        macro: [
          { label: 'GDP growth', val: 'Accelerating', dir: 'up' },
          { label: 'Inflation', val: 'Low / rising', dir: 'up' },
          { label: 'Interest rates', val: 'Low / stable', dir: 'flat' },
          { label: 'Credit spreads', val: 'Tightening', dir: 'up' },
        ],
        alloc: [35, 15, 18, 10, 8, 4, 10],
        thesis: 'Risk-on environment. Equities lead as earnings recover. Credit spreads tighten. Avoid long-duration bonds — rates will eventually rise. Real assets begin to recover.'
      },
      {
        macro: [
          { label: 'GDP growth', val: 'Peaking', dir: 'flat' },
          { label: 'Inflation', val: 'Rising', dir: 'up' },
          { label: 'Interest rates', val: 'Rising', dir: 'up' },
          { label: 'Credit spreads', val: 'Tight / stable', dir: 'flat' },
        ],
        alloc: [28, 14, 13, 10, 15, 5, 15],
        thesis: 'Inflation hedge becomes critical — tilt toward commodities, real assets, and TIPS. Equities still positive but late-cycle rotation begins. Reduce long-duration fixed income exposure.'
      },
      {
        macro: [
          { label: 'GDP growth', val: 'Slowing', dir: 'down' },
          { label: 'Inflation', val: 'High / peaking', dir: 'flat' },
          { label: 'Interest rates', val: 'High / peaking', dir: 'flat' },
          { label: 'Credit spreads', val: 'Widening', dir: 'down' },
        ],
        alloc: [18, 10, 24, 10, 13, 12, 13],
        thesis: 'Defensiveness increases. Shift toward investment-grade bonds and defensive equities. Reduce credit risk as spreads widen. Cash buffer grows. Commodities begin to fade.'
      },
      {
        macro: [
          { label: 'GDP growth', val: 'Contracting', dir: 'down' },
          { label: 'Inflation', val: 'Falling', dir: 'down' },
          { label: 'Interest rates', val: 'Cutting', dir: 'down' },
          { label: 'Credit spreads', val: 'Wide', dir: 'down' },
        ],
        alloc: [12, 5, 35, 5, 5, 28, 10],
        thesis: 'Capital preservation mode. Long-duration Treasuries rally as rates are cut. Cash is king. Equities and commodities fall sharply. Opportunity builds for recovery reallocation.'
      }
    ];

    let current = 0;

    function setPhase(i) {
      current = i;
      document.querySelectorAll('.phase-btn').forEach((b, j) => b.classList.toggle('active', i === j));
      render();
    }

    function render() {
      const p = phases[current];
      document.getElementById('macroGrid').innerHTML = p.macro.map(m => `
        <div class="macro-card">
          <div class="macro-label">${m.label}</div>
          <div class="macro-val ${m.dir === 'up' ? 'up' : m.dir === 'down' ? 'down' : 'flat'}">${m.val}</div>
        </div>
      `).join('');
      document.getElementById('legendRow').innerHTML = ASSETS.map((a, i) => `
        <span class="legend-item"><span class="legend-sq" style="background:${COLORS[i]}"></span>${a}</span>
      `).join('');
      document.getElementById('barChart').innerHTML = ASSETS.map((a, i) => `
        <div class="bar-row">
          <div class="bar-name">${a}</div>
          <div class="bar-track"><div class="bar-fill" style="width:${p.alloc[i]}%; background:${COLORS[i]}"></div></div>
          <div class="bar-pct">${p.alloc[i]}%</div>
        </div>
      `).join('');
      document.getElementById('thesis').textContent = p.thesis;
    }

    render();
  </script>
</body>
</html>
