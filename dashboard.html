<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Portal — Antar Wealth Management</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root{--linen:#f0ebe0;--linen-dark:#e6dfd2;--green:#1a3d2a;--green-mid:#1f4d35;--green-light:#2a6644;--gold:#b8952a;--gold-light:#d4ae4a;--cream:#faf6ee;--text:#0f2d1e;--text-mid:#3a5a47;--muted:#7a8c80;--border:rgba(184,149,42,0.2);}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:'DM Sans',sans-serif;font-weight:300;background:var(--linen);color:var(--text);min-height:100vh;}
    nav{background:rgba(240,235,224,0.97);border-bottom:1px solid var(--border);padding:0 3rem;height:68px;display:flex;align-items:center;justify-content:space-between;}
    .nav-brand{display:flex;align-items:center;gap:12px;text-decoration:none;}
    .nav-emblem{height:40px;width:40px;object-fit:contain;}
    .nav-brand-text{display:flex;flex-direction:column;line-height:1.2;}
    .nav-brand-name{font-family:'Cormorant Garamond',serif;font-size:18px;font-weight:500;letter-spacing:0.1em;color:var(--green);}
    .nav-brand-sub{font-size:9px;letter-spacing:0.2em;text-transform:uppercase;color:var(--gold);}
    .nav-right{display:flex;align-items:center;gap:14px;}
    .user-pill{display:flex;align-items:center;gap:8px;padding:5px 12px;border:1px solid var(--linen-dark);background:var(--cream);}
    .avatar{width:28px;height:28px;border-radius:50%;background:rgba(184,149,42,0.15);border:1px solid rgba(184,149,42,0.35);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:500;color:var(--gold);}
    .user-name{font-size:12px;color:var(--text-mid);}
    .sign-out-btn{font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:var(--muted);background:none;border:none;cursor:pointer;font-family:'DM Sans',sans-serif;padding:4px 8px;transition:color 0.15s;}
    .sign-out-btn:hover{color:var(--text);}
    .page-header{background:var(--green);padding:3rem 3rem 2.5rem;}
    .page-header-inner{max-width:900px;margin:0 auto;}
    .page-eyebrow{font-size:11px;letter-spacing:0.25em;text-transform:uppercase;color:var(--gold);margin-bottom:0.75rem;display:flex;align-items:center;gap:10px;}
    .eyebrow-line{width:24px;height:1px;background:var(--gold);}
    .page-title{font-family:'Cormorant Garamond',serif;font-size:clamp(28px,4vw,44px);font-weight:300;color:var(--linen);margin-bottom:0.5rem;}
    .page-sub{font-size:14px;color:rgba(240,235,224,0.5);line-height:1.6;}
    .body{max-width:900px;margin:0 auto;padding:2.5rem 3rem 4rem;}
    .summary-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:2rem;}
    .sum-card{background:var(--cream);border:1px solid var(--linen-dark);border-left:2px solid var(--gold);padding:1.1rem 1.25rem;}
    .sum-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:6px;}
    .sum-val{font-family:'Cormorant Garamond',serif;font-size:26px;font-weight:300;color:var(--green);}
    .sum-sub{font-size:11px;color:var(--muted);margin-top:3px;}
    .section-label{font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:0.08em;color:var(--muted);margin-bottom:1rem;}
    .tools-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;margin-bottom:2rem;}
    .tool-card{background:var(--cream);border:1px solid var(--linen-dark);padding:1.25rem;display:flex;flex-direction:column;gap:8px;position:relative;overflow:hidden;}
    .tool-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;}
    .tool-card.saved::before{background:linear-gradient(90deg,var(--green),var(--gold));}
    .tool-card.empty::before{background:var(--linen-dark);}
    .tc-header{display:flex;align-items:center;justify-content:space-between;}
    .tc-name{font-family:'Cormorant Garamond',serif;font-size:17px;font-weight:400;color:var(--green);}
    .tc-badge{font-size:10px;padding:3px 8px;}
    .badge-saved{background:rgba(29,158,117,0.12);color:#085041;}
    .badge-empty{background:var(--linen-dark);color:var(--muted);}
    .tc-date{font-size:11px;color:var(--muted);}
    .tc-preview{font-size:12px;color:var(--text-mid);line-height:1.5;}
    .tc-actions{display:flex;gap:8px;margin-top:4px;}
    .tc-btn{font-size:11px;letter-spacing:0.06em;text-transform:uppercase;padding:6px 14px;border:1px solid var(--linen-dark);background:var(--linen);color:var(--text-mid);cursor:pointer;font-family:'DM Sans',sans-serif;text-decoration:none;transition:all 0.15s;display:inline-block;}
    .tc-btn:hover{border-color:var(--green);color:var(--green);}
    .tc-btn.primary{background:var(--green);border-color:var(--green);color:var(--linen);}
    .tc-btn.primary:hover{background:var(--green-mid);}
    .loading-state{text-align:center;padding:3rem;color:var(--muted);font-style:italic;}
    footer{background:var(--green);border-top:1px solid var(--border);padding:1.5rem 3rem;display:flex;align-items:center;justify-content:space-between;margin-top:2rem;}
    .footer-copy{font-size:12px;color:rgba(240,235,224,0.3);}
    .footer-mark{font-family:'Cormorant Garamond',serif;font-size:14px;letter-spacing:0.2em;color:var(--gold);}
    @media(max-width:700px){nav{padding:0 1.5rem;}.body{padding:1.5rem;}.summary-grid{grid-template-columns:1fr;}.nav-brand-name{font-size:15px;}.page-header{padding:2rem 1.5rem 1.75rem;}}
  </style>
</head>
<body>
<nav>
  <a href="index.html" class="nav-brand">
    <img src="emblem.jpg" alt="Antar Wealth" class="nav-emblem"/>
    <div class="nav-brand-text">
      <span class="nav-brand-name">Antar Wealth Management</span>
      <span class="nav-brand-sub">Client Portal</span>
    </div>
  </a>
  <div class="nav-right">
    <div class="user-pill">
      <div class="avatar" id="navAvatar">?</div>
      <span class="user-name" id="navUserName">Loading...</span>
    </div>
    <button class="sign-out-btn" onclick="doSignOut()">Sign out</button>
  </div>
</nav>

<div class="page-header">
  <div class="page-header-inner">
    <div class="page-eyebrow"><span class="eyebrow-line"></span>My Portal</div>
    <h1 class="page-title" id="welcomeTitle">Welcome back</h1>
    <p class="page-sub" id="welcomeSub">Loading your saved data...</p>
  </div>
</div>

<div class="body">
  <div class="summary-grid" id="summaryGrid">
    <div class="sum-card"><div class="sum-label">Loading</div><div class="sum-val">—</div></div>
    <div class="sum-card"><div class="sum-label">Loading</div><div class="sum-val">—</div></div>
    <div class="sum-card"><div class="sum-label">Loading</div><div class="sum-val">—</div></div>
  </div>

  <div class="section-label">Your tools</div>
  <div class="tools-grid" id="toolsGrid">
    <div class="loading-state">Loading your saved data...</div>
  </div>
</div>

<footer>
  <span class="footer-copy">© 2026 Antar Wealth Management. For illustrative purposes only.</span>
  <span class="footer-mark">AWM</span>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL='https://sqbwwppfsyukemmzqyzn.supabase.co';
const SUPABASE_KEY='sb_publishable_CtE8hmFqQ35C5Ju3LOaLLQ_sOYPcsHC';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

const TOOLS=[
  {key:'ebs',name:'Economic Balance Sheet',url:'ebs.html',desc:'Human capital, future obligations, and implied allocation.'},
  {key:'goals',name:'Goals Allocation Planner',url:'goals.html',desc:'Portfolio allocation and monthly savings targets per goal.'},
  {key:'mvo',name:'Mean–Variance Optimizer',url:'mvo.html',desc:'Efficient frontier and stock plotter.'},
  {key:'business-cycle',name:'Business Cycle Allocator',url:'business-cycle.html',desc:'Cycle position and suggested allocation.'},
  {key:'cme',name:'Macro Dashboard',url:'cme.html',desc:'Live FRED data and capital market expectations.'},
  {key:'fixed-income',name:'Yield Curve & Duration',url:'fixed-income.html',desc:'Interactive yield curve and bond price sensitivity.'},
  {key:'portfolio',name:'Portfolio Tracker',url:'portfolio.html',desc:'TWR performance, Monte Carlo simulation, and Value at Risk.'},
];

function fmtDate(ts){
  if(!ts)return'';
  return new Date(ts).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
}

function fmtMoney(n){
  if(!n&&n!==0)return'—';
  const abs=Math.abs(n),s=n<0?'-':'';
  if(abs>=1e6)return s+'$'+(abs/1e6).toFixed(2)+'M';
  if(abs>=1000)return s+'$'+Math.round(abs/1000).toLocaleString()+'K';
  return s+'$'+Math.round(abs);
}

async function doSignOut(){
  await sb.auth.signOut();
  window.location.href='login.html';
}

async function init(){
  const{data:{session}}=await sb.auth.getSession();
  if(!session){window.location.href='login.html';return;}

  const user=session.user;
  const firstName=user.user_metadata?.first_name||user.email?.split('@')[0]||'there';
  const initials=((user.user_metadata?.first_name||'?')[0]+(user.user_metadata?.last_name||'')[0]).toUpperCase();

  document.getElementById('navAvatar').textContent=initials||user.email?.[0]?.toUpperCase()||'?';
  document.getElementById('navUserName').textContent=user.user_metadata?.first_name?`${user.user_metadata.first_name} ${user.user_metadata.last_name||''}`.trim():user.email;
  document.getElementById('welcomeTitle').textContent=`Good ${getGreeting()}, ${firstName}.`;

  // Load all saved data
  const{data:rows,error}=await sb.from('user_data').select('tool,data,updated_at').eq('user_id',user.id);
  const saved={};
  if(rows)rows.forEach(r=>{saved[r.tool]={data:r.data,updated_at:r.updated_at};});

  // Summary cards
  const ebsData=saved['ebs']?.data;
  const goalsData=saved['goals']?.data;
  const savedCount=Object.keys(saved).length;
  document.getElementById('summaryGrid').innerHTML=`
    <div class="sum-card">
      <div class="sum-label">Net economic worth</div>
      <div class="sum-val">${ebsData?.netWorth?fmtMoney(ebsData.netWorth):'—'}</div>
      <div class="sum-sub">${ebsData?'From Economic Balance Sheet':'Complete EBS to see this'}</div>
    </div>
    <div class="sum-card">
      <div class="sum-label">Monthly savings target</div>
      <div class="sum-val">${goalsData?.totalMonthly?'$'+Math.round(goalsData.totalMonthly)+'/mo':'—'}</div>
      <div class="sum-sub">${goalsData?'From Goals Planner':'Complete Goals Planner to see this'}</div>
    </div>
    <div class="sum-card">
      <div class="sum-label">Tools saved</div>
      <div class="sum-val">${savedCount} / ${TOOLS.length}</div>
      <div class="sum-sub">Last session ${savedCount>0?fmtDate(Object.values(saved).sort((a,b)=>new Date(b.updated_at)-new Date(a.updated_at))[0]?.updated_at):'—'}</div>
    </div>
  `;

  document.getElementById('welcomeSub').textContent=savedCount>0?`You have ${savedCount} saved tool${savedCount>1?'s':''}. Pick up where you left off.`:'No saved tools yet — open any tool below and click Save progress.';

  // Tools grid
  document.getElementById('toolsGrid').innerHTML=TOOLS.map(t=>{
    const s=saved[t.key];
    const hasSave=!!s;
    return `<div class="tool-card ${hasSave?'saved':'empty'}">
      <div class="tc-header">
        <div class="tc-name">${t.name}</div>
        <span class="tc-badge ${hasSave?'badge-saved':'badge-empty'}">${hasSave?'Saved':'Not started'}</span>
      </div>
      <div class="tc-date">${hasSave?'Last saved '+fmtDate(s.updated_at):'Open the tool and click Save progress'}</div>
      <div class="tc-preview">${t.desc}</div>
      <div class="tc-actions">
        <a href="${t.url}" class="tc-btn primary">${hasSave?'Continue →':'Open tool →'}</a>
      </div>
    </div>`;
  }).join('');
}

function getGreeting(){
  const h=new Date().getHours();
  if(h<12)return'morning';
  if(h<17)return'afternoon';
  return'evening';
}

init();
</script>
</body>
</html>
